# Сообщения приложения

# ------------------- Сообщения продуктов -------------------
# Сообщения об успехе
product.successfully_created = Продукт успешно создан.
product.successfully_updated = Продукт успешно обновлён.
product.successfully_deleted = Продукт успешно удалён.

# Сообщения об ошибках
product.not_found = Продукт с id {id} не найден.
product.empty_list = Список продуктов пуст.
product.invalid_name = Неверное имя продукта: '{name}'
product.code_already_exists = Продукт с кодом {0} уже существует
product.name_already_exists = Продукт с именем {0} уже существует

# ------------------- Сообщения пользователей -------------------
# Сообщения об успехе
user.successfully_logged_in = Пользователь успешно вошёл в систему.
user.successfully_signed_up = Пользователь успешно зарегистрирован. Пожалуйста, проверьте email для подтверждения аккаунта.
user.successfully_verified = Пользователь успешно подтверждён.
user.verification_email_sent = Email для подтверждения успешно отправлен.
user.verification_email_resent = Email для подтверждения успешно отправлен повторно.
user.successfully_deleted = Пользователь успешно удалён.

# Сообщения об ошибках
user.with_id_not_found = Пользователь с id {id} не существует.
user.with_email_not_found = Пользователь с email '{email}' не существует.
user.email_already_exists = Пользователь с email '{email}' уже существует.
user.username_already_exists = Пользователь с именем '{username}' уже существует.
user.not_enabled = Пользователь не активирован. Пожалуйста, подтвердите ваш email.
user.already_verified = Пользователь уже подтверждён.

