# ===============================
# = ИСТОЧНИК ДАННЫХ
# ===============================
# Настройки подключения к базе данных
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ===============================
# = ЛОГИРОВАНИЕ
# ===============================
logging.level.org.springframework=DEBUG

# ===============================
# = БЕЗОПАСНОСТЬ
# ===============================

# Секретный ключ JWT
auth.security.token.secret=JWT_TEST_SECRET
# Время жизни JWT-токена для тестов в секундах, по умолчанию 5 минут
auth.security.token.expiration-time=300

# ===============================
# = EMAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your@email.com
# Сгенерируйте пароль приложения для Gmail, так как Google блокирует доступ из менее безопасных приложений
# https://myaccount.google.com/apppasswords
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Режим отладки
spring.mail.properties.mail.debug=true